<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="100%" height="100%">
  <defs>
    <linearGradient id="flowCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#050814" />
      <stop offset="50%" stopColor="#141c30" />
      <stop offset="100%" stopColor="#080e1b" />
    </linearGradient>
  </defs>

  <rect width="1000" height="625" fill="url(#flowCoverGrad)" />
  <circle cx="500" cy="330" r="220" fill="#f59e0b" fillOpacity="0.12" filter="blur(20px)" />

  <rect x="50" y="50" width="220" height="30" rx="15" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" strokeWidth="1" />
  <text x="160" y="70" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" text-anchor="middle">AUTOMATION MIDDLEWARE</text>

  <text x="50" y="130" fill="#f8fafc" font-family="'Bebas Neue', sans-serif" font-size="44" letter-spacing="2">FLOWPULSE ORCHESTRATOR</text>
  <text x="50" y="160" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="14">Event-Driven Webhook Queues &amp; Resilient Microservices</text>

  <!-- Flow pipeline visualization -->
  <g transform="translate(180, 260)">
    <rect x="0" y="0" width="160" height="90" rx="10" fill="#0c1628" stroke="#334155" strokeWidth="2" />
    <text x="80" y="50" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="14" text-anchor="middle">n8n Ingress</text>

    <path d="M 160 45 L 240 45" stroke="#f59e0b" strokeWidth="3" strokeDasharray="6 4" />

    <rect x="240" y="0" width="160" height="90" rx="10" fill="#0c1628" stroke="#f59e0b" strokeWidth="2" />
    <text x="320" y="50" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="14" text-anchor="middle">Redis Queue</text>

    <path d="M 400 45 L 480 45" stroke="#2dd4bf" strokeWidth="3" strokeDasharray="6 4" />

    <rect x="480" y="0" width="160" height="90" rx="10" fill="#0c1628" stroke="#2dd4bf" strokeWidth="2" />
    <text x="560" y="50" fill="#2dd4bf" font-family="'Space Grotesk', sans-serif" font-size="14" text-anchor="middle">Event Stream</text>
  </g>
</svg>
