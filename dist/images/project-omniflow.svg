<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="amberTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="600" cy="337" r="280" fill="url(#glowAmber)" filter="url(#blurFilter)" />
  <circle cx="850" cy="220" r="180" fill="#14b8a6" fill-opacity="0.15" filter="url(#blurFilter)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Agent Network Nodes -->
  <g stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" stroke-dasharray="6 4">
    <line x1="600" y1="337" x2="380" y2="220" />
    <line x1="600" y1="337" x2="820" y2="220" />
    <line x1="600" y1="337" x2="420" y2="460" />
    <line x1="600" y1="337" x2="780" y2="460" />
    <line x1="380" y1="220" x2="820" y2="220" />
  </g>

  <!-- Central Agent Core -->
  <circle cx="600" cy="337" r="70" fill="#0f192d" stroke="#f59e0b" stroke-width="3" />
  <circle cx="600" cy="337" r="50" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="600" cy="337" r="14" fill="#fbbf24" />

  <!-- Surrounding Agent Nodes -->
  <circle cx="380" cy="220" r="38" fill="#0c1524" stroke="#14b8a6" stroke-width="2" />
  <circle cx="820" cy="220" r="38" fill="#0c1524" stroke="#14b8a6" stroke-width="2" />
  <circle cx="420" cy="460" r="32" fill="#0c1524" stroke="#f59e0b" stroke-width="2" />
  <circle cx="780" cy="460" r="32" fill="#0c1524" stroke="#f59e0b" stroke-width="2" />

  <!-- Badge & Typography -->
  <rect x="60" y="55" width="220" height="34" rx="17" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
  <text x="170" y="77" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">FLAGSHIP STARTUP MVP</text>

  <text x="60" y="140" fill="#f8fafc" font-family="'Bebas Neue', 'Anton', sans-serif" font-size="44" letter-spacing="1.5">OMNIFLOW MULTI-AGENT OS</text>
  <text x="60" y="172" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="15">Autonomous LangGraph Orchestrator &amp; Real-Time Telemetry</text>

  <!-- Status indicator -->
  <circle cx="1120" cy="65" r="5" fill="#10b981" />
  <text x="1105" y="70" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="12" text-anchor="end">SYS ONLINE: 99.4%</text>
</svg>
