<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="omniCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#040713" />
      <stop offset="50%" stopColor="#0f1a30" />
      <stop offset="100%" stopColor="#060b18" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#omniCoverGrad)" />
  <circle cx="600" cy="337" r="320" fill="url(#goldGlow)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.05)" strokeWidth="1">
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="510" x2="1200" y2="510" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Agent Node Network -->
  <g stroke="#f59e0b" strokeWidth="2" strokeDasharray="6 4" opacity="0.6">
    <line x1="600" y1="337" x2="360" y2="230" />
    <line x1="600" y1="337" x2="840" y2="230" />
    <line x1="600" y1="337" x2="420" y2="480" />
    <line x1="600" y1="337" x2="780" y2="480" />
  </g>

  <!-- Core Agent Hub -->
  <circle cx="600" cy="337" r="75" fill="#0d182b" stroke="#f59e0b" strokeWidth="3" />
  <circle cx="600" cy="337" r="55" fill="none" stroke="#2dd4bf" strokeWidth="1.5" strokeDasharray="8 4" />
  <circle cx="600" cy="337" r="16" fill="#fbbf24" />

  <!-- Surrounding Nodes -->
  <circle cx="360" cy="230" r="42" fill="#0b1322" stroke="#14b8a6" strokeWidth="2" />
  <circle cx="840" cy="230" r="42" fill="#0b1322" stroke="#14b8a6" strokeWidth="2" />
  <circle cx="420" cy="480" r="36" fill="#0b1322" stroke="#f59e0b" strokeWidth="2" />
  <circle cx="780" cy="480" r="36" fill="#0b1322" stroke="#f59e0b" strokeWidth="2" />

  <!-- Badge and Labels -->
  <rect x="70" y="60" width="240" height="36" rx="18" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" strokeWidth="1" />
  <text x="190" y="83" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">FLAGSHIP STARTUP MVP</text>

  <text x="70" y="150" fill="#f8fafc" font-family="'Bebas Neue', sans-serif" font-size="52" letter-spacing="2">OMNIFLOW MULTI-AGENT OS</text>
  <text x="70" y="185" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16">Autonomous LangGraph Orchestrator &amp; Real-Time Telemetry</text>

  <!-- Play button water-mark -->
  <g transform="translate(600, 337)">
    <polygon points="-8,-12 14,0 -8,12" fill="#040713" />
  </g>
</svg>
