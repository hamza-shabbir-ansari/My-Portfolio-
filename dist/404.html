<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Page Not Found</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #03060e;
        color: #f6f7f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
      }
      h1 {
        font-size: 4rem;
        margin: 0 0 12px;
        color: #fbbf24;
        font-family: monospace;
      }
      p {
        color: #94a3b8;
        font-size: 1rem;
        margin: 0 0 24px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 10px 24px;
        background: #fbbf24;
        color: #03060e;
        text-decoration: none;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <p>This page could not be found. Head back to the homepage.</p>
      <a href="/">Back to Home</a>
    </div>
  </body>
</html>
