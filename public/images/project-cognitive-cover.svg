<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="100%" height="100%">
  <defs>
    <linearGradient id="cogCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#040b17" />
      <stop offset="50%" stopColor="#0a192f" />
      <stop offset="100%" stopColor="#030812" />
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#14b8a6" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#14b8a6" stopOpacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="625" fill="url(#cogCoverGrad)" />
  <circle cx="500" cy="312" r="260" fill="url(#tealGlow)" />

  <g stroke="#14b8a6" strokeWidth="1.5" opacity="0.4">
    <circle cx="500" cy="312" r="160" fill="none" strokeDasharray="6 4" />
    <circle cx="500" cy="312" r="100" fill="none" strokeDasharray="4 4" />
  </g>

  <!-- Vector Cluster Nodes -->
  <g fill="#2dd4bf">
    <circle cx="420" cy="260" r="14" />
    <circle cx="580" cy="240" r="18" />
    <circle cx="540" cy="370" r="16" />
    <circle cx="440" cy="360" r="12" />
    <circle cx="500" cy="312" r="24" fill="#0f766e" stroke="#2dd4bf" strokeWidth="2" />
  </g>
  <line x1="420" y1="260" x2="500" y2="312" stroke="#14b8a6" strokeWidth="2" opacity="0.7" />
  <line x1="580" y1="240" x2="500" y2="312" stroke="#14b8a6" strokeWidth="2" opacity="0.7" />
  <line x1="540" y1="370" x2="500" y2="312" stroke="#14b8a6" strokeWidth="2" opacity="0.7" />
  <line x1="440" y1="360" x2="500" y2="312" stroke="#14b8a6" strokeWidth="2" opacity="0.7" />

  <rect x="50" y="50" width="180" height="30" rx="15" fill="rgba(20, 184, 166, 0.15)" stroke="#14b8a6" strokeWidth="1" />
  <text x="140" y="70" fill="#2dd4bf" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" text-anchor="middle">ENTERPRISE RAG</text>

  <text x="50" y="130" fill="#f8fafc" font-family="'Bebas Neue', sans-serif" font-size="44" letter-spacing="2">COGNITIVEQUERY ENGINE</text>
